{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Login</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-success w-100">
                Login
            </button>
        </form>

    </div>
</div>

{% endblock %}
